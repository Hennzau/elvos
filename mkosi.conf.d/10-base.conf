[Output]
SplitArtifacts=uki,partitions
ManifestFormat=json

Format=disk
ImageId=elvOS
Output=%i_%v_%a

[Build]
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
Incremental=yes

[Validation]
SecureBoot=yes
SignExpectedPcr=yes

[Content]
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
Keymap=fr
Timezone=Europe/Paris
Hostname=elvos-????-????

UnifiedKernelImageFormat=%i_%v_%a

InitrdProfiles=
KernelInitrdModules=default

Bootable=yes
Bootloader=systemd-boot

Packages=
        # Core system
        base
        linux
        linux-firmware
        amd-ucode
        dbus-broker
        dbus-broker-units
        polkit
        sbctl
        reflector
        dpkg

        # Filesystems
        btrfs-progs
        dosfstools
        erofs-utils

        # Disk encryption and measured boot
        cryptsetup
        tpm2-tss
        tpm2-tools
        libfido2

        # TLS trust and signing
        ca-certificates
        p11-kit
        openssl
        sbsigntools

        # Network
        iwd
        nftables
        iputils
        openssh
        wireless-regdb

        # Firmware updates.
        fwupd

        # Console
        kbd
        less
        nano

        # Building further images with mkosi on this machine
        pacman
        archlinux-keyring
        python
        git
        cpio
        zstd
        curl
        mkosi

        systemd-ukify

RemoveFiles=
        /boot/*-ucode.img

VolatilePackages=
        systemd-ukify
