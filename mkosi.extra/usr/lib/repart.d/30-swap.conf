# Sized to hold a full hibernation image: this machine has 32G of RAM and the
# hibernation image can be as large as MemTotal. Bump this in lockstep if the
# machine ever gets more RAM, otherwise hibernation silently stops working.
# zram-generator additionally provides compressed in-memory swap for ordinary
# paging, so this partition exists mainly for hibernate.
[Partition]
Type=swap
Format=swap
SizeMinBytes=4G
SizeMaxBytes=32G
Encrypt=tpm2
FactoryReset=yes
Label=%M-swap
