[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# This laptop's firmware asserts the power-button GPIO on every wake from
# s2idle, so logind sees a phantom "Power key pressed short." after each
# resume. Acting on it (poweroff, or suspend) would fire on every wake, so
# only a deliberate long press does anything. niri must also have
# `disable-power-key-handling` set, otherwise it grabs the key and suspends.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
