[general]
live_config_reload = true

[env]
TERM = "alacritty"

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 1.0

[font]
size = 11.0
normal = { family = "Zed Mono", style = "Regular" }
bold = { family = "Zed Mono", style = "Bold" }
italic = { family = "Zed Mono", style = "Italic" }
bold_italic = { family = "Zed Mono", style = "Bold Italic" }

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 50000

[selection]
save_to_clipboard = false

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[colors.primary]
background = "#faf4ed"
foreground = "#575279"

[colors.cursor]
text = "#faf4ed"
cursor = "#286983"

[colors.selection]
text = "#575279"
background = "#dfdad9"

[colors.normal]
black   = "#575279"
red     = "#b4637a"
green   = "#428a5a"
yellow  = "#ea9d34"
blue    = "#286983"
magenta = "#907aa9"
cyan    = "#56949f"
white   = "#f2e9e1"

[colors.bright]
black   = "#797593"
red     = "#c2798d"
green   = "#4f9c68"
yellow  = "#f0ae4f"
blue    = "#33809e"
magenta = "#a48cb8"
cyan    = "#6aa8b2"
white   = "#fffaf3"
