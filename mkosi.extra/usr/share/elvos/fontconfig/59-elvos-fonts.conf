<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    elvOS font policy. Mono is Lilex, Sans is IBM Plex, emoji is Noto.

    Numbered 59 so it is read before 60-generic.conf and 60-latin.conf: prefer
    lists accumulate in load order, so ours has to land first to win. It is
    also after 51-local.conf, which keeps a machine-local /etc/fonts/local.conf
    able to override this.
  -->

  <!-- === Generic families ============================================== -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>IBM Plex Sans</family></prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer><family>IBM Plex Serif</family></prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Lilex Nerd Font Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!--
    system-ui / cursive / fantasy are not fontconfig generics, so <alias> does
    not apply and they need explicit rules.

    The CSS ui-* keywords (ui-monospace, ui-serif, ui-sans-serif, ui-rounded)
    are deliberately absent: neither prepend nor assign rules fire for them
    here — 48-guessfamily.conf and 49-sansserif.conf have already rewritten the
    family list by the time this file is read, and ui-monospace still resolved
    to IBM Plex Sans. Browsers resolve those keywords internally anyway, so
    Firefox is pinned through its own font.name.* prefs in mozilla.cfg.
  -->

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>cursive</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>fantasy</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <!-- === Redirect families we cannot uninstall ========================= -->
  <!--
    adwaita-fonts is a hard dependency of gtk3 / gtk4 / gsettings-desktop-
    schemas, so Adwaita Sans and Adwaita Mono are always present and GNOME
    apps request them by name. Rewrite the request itself.
  -->

  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lilex Nerd Font Mono</string>
    </edit>
  </match>

  <!-- Cantarell was GNOME's font before Adwaita Sans; still referenced by
       older themes and .desktop files. -->
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <!-- === Redirect families that are no longer installed ================ -->
  <!--
    ttf-zed-mono-nerd and noto-fonts were dropped from the image. Anything
    still asking for them by name (a stale user config, an imported profile)
    lands on the intended face instead of fontconfig's best guess.
  -->

  <match target="pattern">
    <test name="family"><string>Zed Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lilex Nerd Font Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ZedMono Nerd Font</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lilex Nerd Font Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ZedMono Nerd Font Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lilex Nerd Font Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Zed Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Serif</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lilex Nerd Font Mono</string>
    </edit>
  </match>

  <!-- === Emoji fallback ================================================ -->
  <!--
    Neither Lilex nor IBM Plex has emoji coverage, so append the colour font
    to each family. Append (not prepend) keeps text glyphs coming from the
    real face and only reaches Noto for codepoints it alone covers.
  -->

  <match target="pattern">
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lilex Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lilex Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
