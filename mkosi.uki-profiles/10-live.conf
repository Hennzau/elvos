[UKIProfile]
Profile=
        ID=live
        TITLE=Live System

Cmdline=
        root=tmpfs
        mount.usr=dissect

        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        systemd.mask=systemd-firstboot.service
        systemd.mask=systemd-homed.service
        systemd.mask=systemd-homed-firstboot.service
        systemd.mask=display-manager.service

        systemd.set-credential=passwd.plaintext-password.root:elvos
        systemd.set-credential=passwd.shell.root:/usr/bin/nu
        systemd.set-credential=agetty.autologin:root
        systemd.set-credential=login.noauth:yes
        SYSTEMD_SULOGIN_FORCE=1

        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
        systemd.image_filter=usr=elvOS_*:usr-verity=elvOS_*:usr-verity-sig=elvOS_*
        ipe.enforce=0

SignExpectedPcr=no
