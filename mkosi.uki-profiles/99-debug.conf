[UKIProfile]
Profile=
        ID=debug
        TITLE=Boot with debug logs enabled

Cmdline=
        root=dissect
        mount.usr=dissect

        systemd.mask=systemd-firstboot.service

        systemd.set-credential=passwd.plaintext-password.root:elvos
        SYSTEMD_SULOGIN_FORCE=1

        debug
        systemd.log_level=debug
        systemd.journald.forward_to_console=1

        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=elvOS_*:usr-verity=elvOS_*:usr-verity-sig=elvOS_*:root=elvOS-*:swap=elvOS-*:home=elvOS-*
        ipe.enforce=0

SignExpectedPcr=yes
